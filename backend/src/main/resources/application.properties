# =============================================================
# Smart Water & Energy Station - configuração do backend
# =============================================================
spring.application.name=estacao
server.port=8080

# ---------- Banco H2 em MODO ARQUIVO (os dados persistem após reiniciar) ----------
# O arquivo fica em backend/data/estacao.mv.db -> rode o backend a partir da pasta backend/
spring.datasource.url=jdbc:h2:file:./data/estacao
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# update = cria/atualiza as tabelas SEM apagar os dados já gravados
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Console web do H2 ----------
# http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./data/estacao | usuário: sa | senha: em branco)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- Documentação da API (Swagger) ----------
# http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------- Regras de alerta (abrem falhas automaticamente) ----------
estacao.limites.nivel-minimo=20
estacao.limites.nivel-maximo=95
estacao.limites.vazao-maxima=120
estacao.limites.consumo-maximo=15

# ---------- Simulador de sensores ----------
# Gera leituras de nível, vazão e consumo elétrico a cada intervalo (em milissegundos)
estacao.simulador.habilitado=true
estacao.simulador.intervalo-ms=10000
estacao.simulador.atraso-inicial-ms=3000
