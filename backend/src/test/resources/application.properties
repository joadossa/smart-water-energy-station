# Configuração usada apenas nos testes automatizados (./mvnw test)
# Banco em memória para não mexer no arquivo ./data/estacao
spring.datasource.url=jdbc:h2:mem:estacao-teste;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
estacao.simulador.habilitado=false
